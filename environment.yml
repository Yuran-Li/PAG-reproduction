# Conda skeleton for local PAG reproduction.
# This is NOT a full lockfile — follow docs/ENV.md for torch/vllm/flash-attn order.
name: PAG
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # Install these AFTER creating the env; prefer the order in docs/ENV.md.
      - torch==2.6.0
      - torchvision==0.21.0
      - torchaudio==2.6.0
      - vllm==0.8.2
      - transformers==4.51.3
      - accelerate==1.4.0
      - numpy==1.26.4
      - ray[default]==2.56.0
      - tensordict==0.6.2
      - math-verify==0.9.0
      - wandb==0.28.0
      # flash-attn: use the cu12/torch2.6 cxx11abiFALSE wheel (see docs/ENV.md)
      # then: pip install -e .
